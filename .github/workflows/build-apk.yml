name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5:i386 libstdc++6:i386 zlib1g:i386 cmake libffi-dev libssl-dev
        python -m pip install --upgrade pip
        pip install --upgrade buildozer cython==0.29.36 setuptools

    - name: Run Buildozer with Auto Accept
      run: |
        yes | buildozer -v android debug
      env:
        ANDROID_ACCEPT_LICENSE: "True"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
