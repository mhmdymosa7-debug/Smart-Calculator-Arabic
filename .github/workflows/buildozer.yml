name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: kivy/buildozer-action@master
        id: buildozer
        with:
          filename: buildozer.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
